<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #111b21;
      color: #e9edef;
      padding: 16px;
    }

    h1 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #00a884;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    h1 .icon {
      font-size: 20px;
    }

    .field {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 12px;
      color: #8696a0;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #2a3942;
      border-radius: 6px;
      background: #1f2c33;
      color: #e9edef;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: #00a884;
    }

    input::placeholder {
      color: #5a6b75;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1f2c33;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 14px;
    }

    .toggle-row span {
      font-size: 14px;
      font-weight: 500;
    }

    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
      cursor: pointer;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #3b4a54;
      border-radius: 24px;
      transition: 0.3s;
      border: none;
    }

    .slider::before {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      left: 3px;
      bottom: 3px;
      background: #8696a0;
      border-radius: 50%;
      transition: 0.3s;
    }

    .toggle input:checked + .slider {
      background: #00a884;
    }

    .toggle input:checked + .slider::before {
      transform: translateX(20px);
      background: #fff;
    }

    .status {
      text-align: center;
      font-size: 11px;
      color: #8696a0;
      margin-top: 4px;
    }

    .status.active {
      color: #00a884;
    }

    .save-btn {
      width: 100%;
      padding: 10px;
      background: #00a884;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .save-btn:hover {
      background: #00c49a;
    }

    .save-btn:active {
      background: #008f6f;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .test-btn {
      width: 100%;
      padding: 8px;
      background: #2a3942;
      color: #8696a0;
      border: 1px solid #3b4a54;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .test-btn:hover {
      background: #3b4a54;
      color: #e9edef;
    }

    .status.error {
      color: #ef4444;
    }
  </style>
</head>
<body>
  <h1><span class="icon">&#127760;</span> WhatsApp Translator</h1>

  <div class="toggle-row">
    <span>Translation</span>
    <label class="toggle">
      <input type="checkbox" id="enabled">
      <span class="slider"></span>
    </label>
  </div>

  <div class="field">
    <label for="sourceLang">Translate from</label>
    <select id="sourceLang">
      <option value="Spanish">Spanish</option>
      <option value="French">French</option>
      <option value="German">German</option>
      <option value="Portuguese">Portuguese</option>
      <option value="Italian">Italian</option>
      <option value="Dutch">Dutch</option>
      <option value="Russian">Russian</option>
      <option value="Chinese">Chinese</option>
      <option value="Japanese">Japanese</option>
      <option value="Korean">Korean</option>
      <option value="Arabic">Arabic</option>
      <option value="Hindi">Hindi</option>
      <option value="Turkish">Turkish</option>
      <option value="Polish">Polish</option>
      <option value="Thai">Thai</option>
      <option value="Vietnamese">Vietnamese</option>
      <option value="Indonesian">Indonesian</option>
      <option value="Swahili">Swahili</option>
      <option value="Tagalog">Tagalog</option>
      <option value="Ukrainian">Ukrainian</option>
    </select>
  </div>

  <div class="field">
    <label for="apiKey">Anthropic API Key</label>
    <input type="password" id="apiKey" placeholder="sk-ant-...">
  </div>

  <div class="field">
    <label for="model">Claude Model</label>
    <input type="text" id="model" placeholder="claude-sonnet-4-6">
  </div>

  <button class="save-btn" id="saveBtn">Save Settings</button>
  <div class="btn-row">
    <button class="test-btn" id="testBtn">Test API Connection</button>
  </div>
  <div class="status" id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
